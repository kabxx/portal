name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Node 24.16+ can crash fs.watch on Windows; remove this pin after libuv#5152 ships in Node.
# https://github.com/nodejs/node/issues/63638
env:
  NODE_VERSION: '24.15.0'

jobs:
  quality:
    name: Windows quality and browser lifecycle tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run fmt:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run test:type
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Configure Chromium executable
        shell: pwsh
        run: |
          $browserPath = & node --input-type=module -e "import { chromium } from 'playwright'; process.stdout.write(chromium.executablePath())"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to resolve the Playwright Chromium executable."
          }
          if (-not (Test-Path -LiteralPath $browserPath -PathType Leaf)) {
            throw "Playwright Chromium executable was not found."
          }
          "PORTAL_BROWSER_EXECUTABLE=$browserPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run Chromium lifecycle smoke tests
        run: npm run test:browser

  linux-unit:
    name: Linux unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  macos-unit:
    name: macOS unit tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit
